name: Automated Release & Zenodo Sync

on:
  push:
    tags:
      - 'v*.*.*' # O pipeline só vai rodar quando tem uma tag no formato v1.0.0
      
  workflow_dispatch: 

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Automated Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Cria um changelog automático baseado nos commits
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
